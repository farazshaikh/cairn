[workspace]
resolver = "3"
members = [
    "crates/storage",
    "crates/sql",
    "crates/exec",
    "crates/cli",
    "crates/reference",
    "crates/fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
