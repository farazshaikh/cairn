[package]
name = "cairn-cli"
description = "Interactive shell for cairn databases"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "cairn"
path = "src/main.rs"

[lib]
name = "cairn_cli"
path = "src/lib.rs"

[dependencies]
cairn-exec = { path = "../exec" }
cairn-sql = { path = "../sql" }

[dev-dependencies]
cairn-storage = { path = "../storage" }

[lints]
workspace = true
